<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="rounded">
      <rect width="32" height="32" rx="7" />
    </clipPath>
    <pattern id="stripes" width="7" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <rect width="7" height="32" fill="#ff4d12" />
      <rect width="3.2" height="32" fill="#c43208" />
    </pattern>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="32" height="32" fill="url(#stripes)" />
  </g>
</svg>
